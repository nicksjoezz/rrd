{% extends "base.html" %}
{% block title %}Positions{% endblock %}
{% block page_title %}POSITION SCANNER{% endblock %}

{% block content %}
<div class="card animate-in">
  <div class="card-header"><div class="card-title">Zombies (Persistence Queue)</div></div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>USER</th><th>PROTOCOL</th><th>HF</th><th>DEBT</th><th>QUEUED</th></tr></thead>
      <tbody id="zombie-body"></tbody>
    </table>
  </div>
</div>

<div class="card animate-in" style="margin-top:25px">
  <div class="card-header"><div class="card-title">Active Positions (High Risk)</div></div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>USER</th><th>PROTOCOL</th><th>HF</th><th>DEBT</th><th>STATUS</th></tr></thead>
      <tbody id="positions-body"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function onPositions(pos) {
  const body = document.getElementById('positions-body');
  body.innerHTML = pos.map(p => {
    const badge = p.health_factor < 1.0 ? '<span class="badge badge-red">LIQUIDATABLE</span>' : '<span class="badge badge-amber">DANGER</span>';
    return `<tr><td class="green">${fmtAddr(p.address)}</td><td>${p.protocol}</td><td class="${p.health_factor<1?'red':'amber'}">${p.health_factor.toFixed(5)}</td><td>${fmtUSD(p.total_debt_usd)}</td><td>${badge}</td></tr>`;
  }).join('');
}
function onZombies(z) {
  const body = document.getElementById('zombie-body');
  body.innerHTML = Object.entries(z).map(([k, v]) => `<tr><td class="amber">${fmtAddr(v.user)}</td><td>${v.protocol}</td><td class="amber">${v.health_factor.toFixed(5)}</td><td class="green">${fmtUSD(v.total_debt_usd)}</td><td>${new Date(v.queued_at*1000).toLocaleTimeString()}</td></tr>`).join('');
}
</script>
{% endblock %}
