<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LiqBot{% endblock %} — Arbitrum Liquidator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #020b05;
  --bg1:       #040f08;
  --bg2:       #071610;
  --green:     #00ff41;
  --green-dim: #00c832;
  --green-lo:  #00ff4122;
  --green-mid: #00ff4155;
  --amber:     #ffa500;
  --red:       #ff2244;
  --cyan:      #00e5ff;
  --purple:    #b44fff;
  --sim:       #ff9000;
  --sim-lo:    #ff900022;
  --text:      #c8ffd4;
  --text-dim:  #5a8a62;
  --text-lo:   #2a4a2e;
  --border:    #00ff4130;
  --border-hi: #00ff4170;
  --glow:      0 0 10px #00ff4155, 0 0 30px #00ff4122;
  --font-mono: 'IBM Plex Mono', 'Share Tech Mono', monospace;
  --font-hud:  'Orbitron', monospace;
}

html { font-size: 14px; scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-mono); min-height: 100vh; overflow-x: hidden;
}
#matrix-canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.07; pointer-events: none; }

#app { position: relative; z-index: 2; display: flex; min-height: 100vh; }

/* ── Sidebar ── */
#sidebar {
  width: 240px; flex-shrink: 0;
  background: linear-gradient(180deg, var(--bg1) 0%, var(--bg) 100%);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.sidebar-logo { padding: 24px 20px; border-bottom: 1px solid var(--border); }
.logo-mark { font-family: var(--font-hud); font-size: 14px; font-weight: 900; color: var(--green); text-shadow: var(--glow); letter-spacing: 0.1em; }

/* Hamburger */
.hamburger {
  display: none; cursor: pointer; padding: 15px; z-index: 110;
  position: fixed; top: 5px; left: 5px; background: var(--bg1); border: 1px solid var(--border);
}
.hamburger span { display: block; width: 22px; height: 2px; background: var(--green); margin: 4px 0; }

#sidebar-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 90;
}

/* Nav */
.nav { flex: 1; padding: 15px 0; overflow-y: auto; }
.nav-link {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; font-size: 13px; color: var(--text-dim); text-decoration: none;
  transition: 0.2s; border-left: 3px solid transparent;
}
.nav-link:hover { background: var(--green-lo); color: var(--text); }
.nav-link.active { color: var(--green); border-left-color: var(--green); background: var(--green-lo); }

/* Bot Control */
.sidebar-ctrl { padding: 20px; border-top: 1px solid var(--border); }
.btn-pill {
  width: 100%; padding: 10px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text); font-family: var(--font-hud);
  font-size: 10px; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between;
}
.btn-pill.active { border-color: var(--green); color: var(--green); box-shadow: var(--glow); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #444; }
.active .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }

/* ── Main ── */
#main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; width: calc(100% - 240px); }

#topbar {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 25px; border-bottom: 1px solid var(--border);
  background: rgba(2,11,5,0.8); backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 80;
}

/* ── Responsive ── */
@media (max-width: 1024px) {
  #sidebar { width: 200px; }
  #main { margin-left: 200px; width: calc(100% - 200px); }
}

@media (max-width: 768px) {
  #sidebar { transform: translateX(-100%); width: 240px; }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay.show { display: block; }
  #main { margin-left: 0; width: 100%; }
  .hamburger { display: block; }
  #topbar { padding-left: 70px; }
}

/* ── Components ── */
.page { padding: 25px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
.stat-card { background: var(--bg1); border: 1px solid var(--border); padding: 20px; position: relative; }
.stat-label { font-size: 10px; color: var(--text-lo); font-family: var(--font-hud); margin-bottom: 10px; }
.stat-value { font-size: 24px; font-family: var(--font-hud); color: var(--green); }

.card { background: var(--bg1); border: 1px solid var(--border); margin-bottom: 25px; }
.card-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.card-title { font-size: 11px; font-family: var(--font-hud); color: var(--text-dim); }

.table-wrap { width: 100%; overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; min-width: 700px; }
.data-table th { text-align: left; padding: 12px 20px; font-size: 10px; color: var(--text-lo); border-bottom: 1px solid var(--border); }
.data-table td { padding: 12px 20px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid rgba(0,255,65,0.05); }

.badge { padding: 3px 8px; font-size: 9px; font-family: var(--font-hud); border: 1px solid; border-radius: 2px; }
.badge-red { border-color: var(--red); color: var(--red); background: rgba(255,34,68,0.1); }
.badge-amber { border-color: var(--amber); color: var(--amber); background: rgba(255,165,0,0.1); }
.badge-green { border-color: var(--green); color: var(--green); background: rgba(0,255,65,0.1); }

.green { color: var(--green); }
.amber { color: var(--amber); }
.red   { color: var(--red); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>

<div id="app">
  <nav id="sidebar">
    <div class="sidebar-logo"><span class="logo-mark">⬡ LIQBOT</span></div>
    <div class="nav">
      <a href="/" class="nav-link {% if request.endpoint=='page_dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/positions" class="nav-link {% if request.endpoint=='page_positions' %}active{% endif %}">Positions</a>
      <a href="/settings" class="nav-link {% if request.endpoint=='page_settings' %}active{% endif %}">Settings</a>
    </div>
    <div class="sidebar-ctrl">
      <div id="bot-status-pill" class="btn-pill" onclick="handleBotToggle()">
        <span>BOT: <span id="bot-status-label">OFFLINE</span></span>
        <div class="dot"></div>
      </div>
      <div id="mode-pill" class="btn-pill mt-8" onclick="handleModeToggle()" style="margin-top:10px">
        <span>MODE: <span id="mode-label">SIMULATE</span></span>
      </div>
    </div>
  </nav>

  <div id="main">
    <header id="topbar">
      <div style="font-family:var(--font-hud); font-size:12px">{% block page_title %}DASHBOARD{% endblock %}</div>
      <div id="top-stats" style="display:flex; gap:20px">
        <div class="stat-mini"><div class="val green" id="top-profit">$0.00</div></div>
      </div>
    </header>
    <main class="page">{% block content %}{% endblock %}</main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}

const socket = io();
let _currentMode = 'simulate';

socket.on('stats', d => {
  setEl('top-profit', '$'+(d.total_profit_est_usd||0).toFixed(2));
  if(typeof onStats==='function') onStats(d);
});

socket.on('bot_status', d => {
  const pill = document.getElementById('bot-status-pill');
  pill.classList.toggle('active', d.running);
  setEl('bot-status-label', d.running?'RUNNING':'OFFLINE');
  if(d.mode) updateModeUI(d.mode);
});

socket.on('positions', d => { if(typeof onPositions==='function') onPositions(d); });
socket.on('zombies', d => { if(typeof onZombies==='function') onZombies(d); });

function updateModeUI(mode) {
  _currentMode = mode;
  setEl('mode-label', mode.toUpperCase());
}

async function handleModeToggle() {
  const next = _currentMode === 'simulate' ? 'live' : 'simulate';
  const r = await fetch('/api/mode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({mode: next}) });
  const d = await r.json();
  if(d.ok) updateModeUI(next);
}

async function handleBotToggle() {
  const active = document.getElementById('bot-status-pill').classList.contains('active');
  fetch(active?'/api/bot/stop':'/api/bot/start', {method:'POST'});
}

function setEl(id, v) { const el=document.getElementById(id); if(el) el.textContent=v; }
function fmtAddr(a) { return a ? a.slice(0,6)+'...'+a.slice(-4) : '—'; }
function fmtUSD(n) { return '$' + (parseFloat(n)||0).toFixed(2); }

(async()=>{ const r=await fetch('/api/mode'); const d=await r.json(); updateModeUI(d.mode); })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
