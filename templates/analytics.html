{% extends "base.html" %}
{% block title %}Analytics{% endblock %}
{% block page_title %}ANALYTICS{% endblock %}

{% block content %}
<div class="stat-grid animate-in">
  <div class="stat-card"><div class="stat-label">30D Profit</div><div class="stat-value" id="a-30d-profit">$0.00</div></div>
  <div class="stat-card"><div class="stat-label">30D Count</div><div class="stat-value" id="a-30d-count">0</div></div>
</div>

<div class="card animate-in">
  <div class="card-header"><div class="card-title">Daily Performance</div></div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>DAY</th><th>LIQS</th><th>PROFIT</th></tr></thead>
      <tbody id="daily-body"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadAnalytics() {
  const r = await fetch('/api/analytics');
  const d = await r.json();
  setEl('a-30d-profit', fmtUSD(d.period.profit));
  setEl('a-30d-count', d.period.count);
  const body = document.getElementById('daily-body');
  body.innerHTML = (d.daily||[]).reverse().map(day => `<tr><td>${day.day}</td><td>${day.count}</td><td class="green">${fmtUSD(day.profit)}</td></tr>`).join('');
}
loadAnalytics();
</script>
{% endblock %}
