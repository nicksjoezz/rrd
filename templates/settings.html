{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}SETTINGS{% endblock %}

{% block content %}
<div class="card animate-in">
  <div class="card-header"><div class="card-title">Configuration Control</div></div>
  <div class="page" style="padding: 20px">
    <div class="stat-grid">
      <div class="field">
        <label class="stat-label">RPC HTTP</label>
        <input type="text" id="cfg-rpc-http" class="stat-card" style="width:100%; border:1px solid var(--border); background:var(--bg2); color:var(--text); padding:10px">
      </div>
      <div class="field">
        <label class="stat-label">Liquidator Contract</label>
        <input type="text" id="cfg-contract" class="stat-card" style="width:100%; border:1px solid var(--border); background:var(--bg2); color:var(--text); padding:10px">
      </div>
    </div>
    <button class="btn mt-8" onclick="saveSettings()">SAVE SETTINGS</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadSettings() {
  const r = await fetch('/api/config');
  const c = await r.json();
  setVal('cfg-rpc-http', c.network.rpc_http);
  setVal('cfg-contract', c.wallet.liquidator_contract);
}
async function saveSettings() {
  const r = await fetch('/api/config');
  const c = await r.json();
  c.network.rpc_http = document.getElementById('cfg-rpc-http').value;
  c.wallet.liquidator_contract = document.getElementById('cfg-contract').value;
  await fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(c) });
  alert('Settings saved');
}
loadSettings();
</script>
{% endblock %}
